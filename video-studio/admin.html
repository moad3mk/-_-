async function loadSupportTickets(){const q=await Promise.race([sb.from("support_tickets").select("*").order("created_at",{ascending:false}),new Promise((_,reject)=>setTimeout(()=>reject(new Error("انتهت مهلة تحميل التذاكر (3 ثوانٍ)")),3000))]).catch(error=>({error}));if(q.error){$("supportTickets").innerHTML='<div class="empty">تعذر تحميل التذاكر: '+esc(q.error.message)+'</div>';return;}$("supportTickets").innerHTML=(q.data||[]).map(t=>'<article class="order"><b>'+esc(t.subject)+'</b><p>'+esc(t.message)+'</p><p class="muted">رقم العضو: '+esc(t.user_id)+' · '+new Date(t.created_at).toLocaleString("ar-LY")+'</p><label class="field">رد الدعم الفني<textarea data-ticket-reply="'+esc(t.id)+'" rows="3" style="width:100%;background:#17263d;color:white;border:1px solid #263750;border-radius:10px;padding:10px">'+esc(t.admin_reply||"")+'</textarea></label><label class="field">الحالة<select data-ticket-status="'+esc(t.id)+'"><option '+(t.status==="مفتوحة"?"selected":"")+'>مفتوحة</option><option '+(t.status==="قيد المتابعة"?"selected":"")+'>قيد المتابعة</option><option '+(t.status==="مغلقة"?"selected":"")+'>مغلقة</option></select></label><button class="primary" data-ticket-save="'+esc(t.id)+'">حفظ الرد والحالة</button></article>').join("")||'<div class="empty">لا توجد تذاكر حالياً.</div>';document.querySelectorAll("[data-ticket-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.ticketSave,reply=document.querySelector('[data-ticket-reply="'+id+'"]').value,status=document.querySelector('[data-ticket-status="'+id+'"]').value;const r=await sb.from("support_tickets").update({admin_reply:reply,status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert("تعذر حفظ الرد: "+r.error.message);else alert("تم حفظ رد الدعم.");});}

\nasync function loadCustomRoles(){const q=await sb.from("custom_roles").select("*").order("sort_order",{ascending:true}).order("name");if(q.error){$("customRoleMessage").textContent="تعذر تحميل الرتب: "+q.error.message;return}customRoles=q.data||[];const protectedRoles=["مالك","مدير","مشرف","VIP","عضو"];$("customRoleList").innerHTML=customRoles.map((r,i)=>'<div class="user"><div><b style="color:'+esc(r.color)+'">'+esc(r.icon||"⭐")+' '+esc(r.name)+'</b><small>الترتيب: '+esc(r.sort_order??50)+'</small></div><span class="muted">'+esc((r.permissions||[]).join("، "))+'</span>'+(isOwner?'<div style="display:flex;gap:6px"><button data-move-role="up" data-role-name="'+esc(r.name)+'" '+(i===0?"disabled":"")+'>↑</button><button data-move-role="down" data-role-name="'+esc(r.name)+'" '+(i===customRoles.length-1?"disabled":"")+'>↓</button>'+(!protectedRoles.includes(r.name)?'<button data-remove-role="'+esc(r.name)+'">حذف</button>':'<span class="muted">أساسية</span>')+'</div>':'')+'</div>').join("")||'<div class="empty">مافيش رتب.</div>';document.querySelectorAll("[data-move-role]").forEach(b=>b.onclick=async()=>{if(!isOwner)return;const i=customRoles.findIndex(x=>x.name===b.dataset.roleName),j=b.dataset.moveRole==="up"?i-1:i+1;if(i<0||j<0||j>=customRoles.length)return;const a=customRoles[i],z=customRoles[j],ao=Number(a.sort_order??(i*10)),zo=Number(z.sort_order??(j*10));const one=await sb.from("custom_roles").update({sort_order:zo}).eq("name",a.name);if(one.error){alert("تعذر تغيير الترتيب: "+one.error.message);return}const two=await sb.from("custom_roles").update({sort_order:ao}).eq("name",z.name);if(two.error){alert("تعذر إكمال تغيير الترتيب: "+two.error.message);return}await loadCustomRoles()});document.querySelectorAll("[data-remove-role]").forEach(b=>b.onclick=async()=>{if(!isOwner)return;if(!confirm("متأكد تبي تحذف الرتبة؟"))return;const d=await sb.from("custom_roles").delete().eq("name",b.dataset.removeRole);if(d.error)alert(d.error.message);else loadCustomRoles()})}
$("customRoleForm").onsubmit=async e=>{e.preventDefault();const roleName=$("customRoleName").value.trim();const existing=customRoles.find(x=>x.name===roleName);const nextOrder=customRoles.length?Math.max(...customRoles.map(x=>Number(x.sort_order??50)))+10:50;const role={name:roleName,color:$("customRoleColor").value,icon:$("customRoleIcon").value.trim(),permissions:[...document.querySelectorAll("[data-permission]:checked")].map(x=>x.value),...(existing?{}:{sort_order:nextOrder})};const q=await sb.from("custom_roles").upsert(role,{onConflict:"name"});$("customRoleMessage").textContent=q.error?"تعذر الحفظ: "+q.error.message:"تم حفظ الرتبة بنجاح.";if(!q.error){e.target.reset();loadCustomRoles()}};
