<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة NEXORA SHOP</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#111c2e;--line:#263750;--muted:#91a1bb;--cyan:#54d9e8;--blue:#719cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#14233c 0,#080e19 55%);color:#eef4ff;font-family:Arial,Tahoma,sans-serif;min-height:100vh}header{position:sticky;top:0;background:#0b1424ed;border-bottom:1px solid var(--line);padding:16px clamp(14px,4vw,38px);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}h1{font-size:clamp(19px,4vw,28px);margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:12px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:#17263d;color:#eef4ff}button{cursor:pointer}button.primary{background:linear-gradient(120deg,#4dd8e7,#7a9cff);color:#07101d;border:0;font-weight:bold}main{width:min(1100px,calc(100% - 28px));margin:26px auto 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat,.order,.empty,.login{background:#111c2e;border:1px solid var(--line);border-radius:16px;padding:17px}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat b{font-size:26px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.section h2{font-size:19px;margin:0}.orders,.users{display:grid;gap:12px}.order-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.order-top small,.muted{color:var(--muted);font-size:12px}.order p{font-size:14px;line-height:1.6;margin:9px 0}.field{display:grid;gap:8px;margin:13px 0}.field input{width:100%}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}.login{max-width:440px;margin:8vh auto}.login h2{margin-top:0}.login p{color:var(--muted);font-size:13px;line-height:1.7}.user{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#111c2e;border:1px solid var(--line);padding:12px;border-radius:12px}.user small{display:block;color:var(--muted);margin-top:4px}.user select{min-width:115px}@media(max-width:520px){.stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}header{align-items:flex-start}}
</style></head><body>
<header><div><h1>لوحة إدارة NEXORA</h1><p id="who">تسجيل دخول المدير مطلوب</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="refresh" class="hidden">تحديث</button><button onclick="location.href='./'">رجوع للمتجر</button></div></header>
<main><section id="loginPanel" class="login"><h2>يلزم تسجيل الدخول</h2><p id="message" aria-live="polite">سجّل دخولك من المتجر أولاً، وبعدها ارجع للوحة الإدارة. نفس الحساب ونفس الجلسة، من غير تسجيل دخول مرة ثانية.</p><button class="primary" onclick="location.href='./'">الذهاب للمتجر وتسجيل الدخول</button></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat"><small>كل الطلبات</small><b id="total">0</b></div><div class="stat"><small>طلبات جديدة</small><b id="fresh">0</b></div><div class="stat"><small>مكتملة</small><b id="done">0</b></div></div><div class="section"><h2>الطلبات الواردة</h2></div><div class="orders" id="orders"></div><div class="section"><h2>إدارة رتب الأعضاء</h2><span class="muted">تغيير الرتب متاح للمدير فقط</span></div><div class="users" id="users"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://xwcukpzibwogtovatxrm.supabase.co","sb_publishable_o2m2T1bxzdxYlgjpgDZQag_K0GoqAsZ",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});const $=id=>document.getElementById(id);let me=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){const {data:{session}}=await sb.auth.getSession();const user=session?.user||null;me=user;if(!user){showLogin("مافيش حساب مسجّل حالياً. سجّل دخولك من المتجر، وبعدها ارجع لهنا.");return;}const {data:profile,error}=await sb.from("profiles").select("username,role,roles").eq("id",user.id).maybeSingle();if(error||!profile){showLogin("تعذر قراءة ملف حسابك. تأكد إن قاعدة البيانات اشتغلت بشكل صحيح.");return;}const assigned=profile.roles?.length?profile.roles:[profile.role];const rr=await sb.from("custom_roles").select("name,permissions").in("name",assigned);const perms=(rr.data||[]).flatMap(x=>x.permissions||[]);if(!assigned.includes("مالك")&&!perms.includes("all")&&!perms.includes("admin_access")){showLogin("حسابك ما عندهش صلاحية دخول لوحة الإدارة.");return;}$("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("refresh").classList.remove("hidden");$("who").textContent=(profile.username||user.email)+" · "+profile.role;await render();}
function showLogin(message){$("message").textContent=message||"سجّل دخولك من المتجر أولاً."; $("loginPanel").classList.remove("hidden");$("dashboard").classList.add("hidden");$("refresh").classList.add("hidden");}

$("refresh").onclick=render;
async function render(){const [ordersResult,profilesResult,rolesResult]=await Promise.all([sb.from("orders").select("*").order("created_at",{ascending:false}),sb.from("profiles").select("id,username,role,roles,created_at").order("created_at",{ascending:false}),sb.from("custom_roles").select("name,icon,color").order("name")]);customRoles=rolesResult.data||[];if(ordersResult.error){$("orders").innerHTML='<div class="empty">'+esc(ordersResult.error.message)+'</div>';return;}const a=ordersResult.data||[];$("total").textContent=a.length;$("fresh").textContent=a.filter(x=>x.status==="جديد").length;$("done").textContent=a.filter(x=>x.status==="مكتمل").length;$("orders").innerHTML=a.length?a.map(o=>'<article class="order"><div class="order-top"><b>'+esc(o.product)+' · '+esc(o.price)+' د.ل</b><small>'+new Date(o.created_at).toLocaleString("ar-LY")+'</small></div><p>الاسم: '+esc(o.customer)+' · معرف اللعبة: '+esc(o.game_id)+'</p><p>التواصل: '+esc(o.contact)+' · المستخدم: '+esc(o.user_id)+'</p>'+(o.notes?'<p>ملاحظات: '+esc(o.notes)+'</p>':'')+'<label class="field">حالة الطلب<select data-order="'+esc(o.id)+'">'+["جديد","قيد التنفيذ","مكتمل","ملغي"].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></label></article>').join(""):'<div class="empty">مافيش طلبات توا.</div>';document.querySelectorAll("[data-order]").forEach(sel=>sel.onchange=async()=>{const {error}=await sb.from("orders").update({status:sel.value}).eq("id",sel.dataset.order);if(error)alert(error.message);else render();});if(profilesResult.error){$("users").innerHTML='<div class="empty">'+esc(profilesResult.error.message)+'</div>';return;}const u=profilesResult.data||[];const roleChoices=["عضو","VIP","مشرف","مدير","مالك",...customRoles.map(r=>r.name)].filter((x,i,a)=>a.indexOf(x)===i);$("users").innerHTML=u.map(p=>{const assigned=p.roles?.length?p.roles:[p.role];return '<div class="user" style="display:block"><div><b>'+esc(p.username)+'</b><small>'+esc(p.id)+'</small></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0">'+roleChoices.map(r=>'<label style="font-size:13px"><input type="checkbox" data-role-choice="'+esc(r)+'" data-user="'+esc(p.id)+'" '+(assigned.includes(r)?'checked':'')+'> '+esc(r)+'</label>').join("")+'</div><button data-save-roles="'+esc(p.id)+'" class="primary">حفظ الرتب</button><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button data-ban="'+esc(p.id)+'">حظر عضو</button><button data-timeout="'+esc(p.id)+'">تايم عضو</button><button data-unban="'+esc(p.id)+'">فك الحظر / التايم</button></div></div>'}).join("")||'<div class="empty">لا يوجد أعضاء.</div>';
document.querySelectorAll("[data-save-roles]").forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.saveRoles;const roles=[...document.querySelectorAll('[data-user="'+id+'"]:checked')].map(x=>x.dataset.roleChoice);const q=await sb.rpc("admin_set_roles",{target_user:id,new_roles:roles});if(q.error)alert(q.error.message);else alert("تم حفظ الرتب المتعددة.");});
document.querySelectorAll("[data-ban]").forEach(btn=>btn.onclick=async()=>{const why=prompt("سبب الحظر (اختياري):")||"";const q=await sb.rpc("admin_moderate_user",{target_user:btn.dataset.ban,action:"ban",minutes:null,why});if(q.error)alert(q.error.message);else alert("تم حظر العضو من الدردشة.");});
document.querySelectorAll("[data-timeout]").forEach(btn=>btn.onclick=async()=>{const mins=Number(prompt("مدة التايم بالدقائق (من 1 إلى 10080):","10"));if(!Number.isInteger(mins)||mins<1||mins>10080)return;const why=prompt("سبب التايم (اختياري):")||"";const q=await sb.rpc("admin_moderate_user",{target_user:btn.dataset.timeout,action:"timeout",minutes:mins,why});if(q.error)alert(q.error.message);else alert("تم تطبيق التايم.");});
document.querySelectorAll("[data-unban]").forEach(btn=>btn.onclick=async()=>{const q=await sb.rpc("admin_moderate_user",{target_user:btn.dataset.unban,action:"unban",minutes:null,why:""});if(q.error)alert(q.error.message);else alert("تم فك الحظر / التايم.");});}

let customRoles=[];
const adminMain=document.querySelector("#dashboard");
const tabbar=document.createElement("nav");
tabbar.style.cssText="display:flex;gap:10px;margin:20px 0";
tabbar.innerHTML='<button id="ordersTab" class="primary">📦 عرض طلبات</button><button id="rolesTab">🏷️ تحكم في رتب</button>';
adminMain.prepend(tabbar);
const rolesPanel=document.createElement("section");
rolesPanel.id="customRolesPanel";rolesPanel.className="hidden";
rolesPanel.innerHTML='<div class="order"><h2>إنشاء رتبة</h2><form id="customRoleForm"><label class="field">اسم الرتبة<input id="customRoleName" required maxlength="30"></label><label class="field">لون الرتبة<input id="customRoleColor" type="color" value="#8b5cf6"></label><label class="field">أيقونة الرتبة<input id="customRoleIcon" value="⭐" maxlength="8"></label><div class="field"><b>اختر صلاحيات الرتبة</b><div id="permissionChoices" style="display:grid;gap:9px"></div></div><button class="primary">حفظ الرتبة</button><p id="customRoleMessage" class="muted"></p></form></div><div class="section"><h2>الرتب المخصصة</h2></div><div id="customRoleList" class="users"></div>';
adminMain.appendChild(rolesPanel);
const oldOrders=adminMain.querySelector(".orders");
const oldUsers=adminMain.querySelector(".users");
const originalOrders=oldOrders;
const originalUsers=oldUsers;
const ordersHeading=oldOrders.previousElementSibling;
const usersHeading=oldUsers.previousElementSibling;
originalUsers.classList.add("hidden");usersHeading.classList.add("hidden");
$("ordersTab").onclick=()=>{originalOrders.classList.remove("hidden");ordersHeading.classList.remove("hidden");originalUsers.classList.add("hidden");usersHeading.classList.add("hidden");rolesPanel.classList.add("hidden")};
$("rolesTab").onclick=()=>{originalOrders.classList.add("hidden");ordersHeading.classList.add("hidden");originalUsers.classList.remove("hidden");usersHeading.classList.remove("hidden");rolesPanel.classList.remove("hidden");loadCustomRoles()};
async function loadCustomRoles(){const q=await sb.from("custom_roles").select("*").order("created_at");if(q.error){$("customRoleMessage").textContent="شغّل تحديث قاعدة البيانات أولاً: "+q.error.message;return}customRoles=q.data||[];$("customRoleList").innerHTML=customRoles.map(r=>'<div class="user"><b style="color:'+esc(r.color)+'">'+esc(r.icon)+' '+esc(r.name)+'</b><span class="muted">'+esc((r.permissions||[]).join("، "))+'</span><button data-remove-role="'+esc(r.name)+'">حذف</button></div>').join("")||'<div class="empty">مافيش رتب مخصصة لحد الآن.</div>';document.querySelectorAll("[data-remove-role]").forEach(b=>b.onclick=async()=>{if(!confirm("متأكد تبي تحذف الرتبة؟"))return;const d=await sb.from("custom_roles").delete().eq("name",b.dataset.removeRole);if(d.error)alert(d.error.message);else loadCustomRoles()})}
$("customRoleForm").onsubmit=async e=>{e.preventDefault();const role={name:$("customRoleName").value.trim(),color:$("customRoleColor").value,icon:$("customRoleIcon").value.trim(),permissions:[...document.querySelectorAll("[data-permission]:checked")].map(x=>x.value)};const q=await sb.from("custom_roles").upsert(role,{onConflict:"name"});$("customRoleMessage").textContent=q.error?"تعذر الحفظ: "+q.error.message:"تم حفظ الرتبة بنجاح.";if(!q.error){e.target.reset();loadCustomRoles()}};

const permissionList=[["admin_access","دخول إلى لوحة إدارة"],["delete_messages","حذف رسائل شات"],["ban_members","حظر عضو"],["timeout_members","تايم عضو"],["manage_roles","إدارة الرتب"]];$("permissionChoices").innerHTML=permissionList.map(([v,t])=>'<label><input type="checkbox" data-permission value="'+v+'"> '+t+'</label>').join("");init();
</script></body></html>
