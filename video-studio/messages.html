<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA - المحادثات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f7ff;font-family:system-ui,Arial;min-height:100vh}.wrap{width:min(850px,94%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}.top a{color:white;text-decoration:none;background:#1b2b43;padding:10px 13px;border-radius:10px}.muted{color:#9eabc2;font-size:12px}.chat{height:calc(100dvh - 105px);min-height:430px;background:#111a2b;border:1px solid #263650;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.head{padding:14px;border-bottom:1px solid #263650}.head h2{margin:0}.feed{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;gap:8px;max-width:90%;align-items:flex-start}.msg.mine{align-self:flex-start;flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#263b5c;flex-shrink:0}.bubble{background:#1b2a42;border:1px solid #2a3d5b;border-radius:14px;padding:9px 12px}.mine .bubble{background:#203c52}.meta{display:flex;gap:9px;margin-bottom:4px}.meta b{font-size:12px;font-weight:400;color:#c7d3e8}.meta small{font-size:10px;color:#9eabc2}.role-tag{font-size:10px;color:#aebbd0;font-weight:400;opacity:.8;margin-inline-start:5px}.body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.composer{display:flex;gap:8px;padding:11px;border-top:1px solid #263650}.composer input{flex:1;min-width:0;background:#080f1c;border:1px solid #344764;border-radius:11px;padding:12px;color:white}.composer button,.login button{background:#719cff;border:0;border-radius:11px;padding:0 18px;font-weight:bold}.empty,.login{margin:auto;text-align:center;color:#9eabc2;padding:25px}.login button{padding:12px 18px;margin-top:10px}@media(max-width:520px){.chat{height:calc(100dvh - 95px);border-radius:14px}.msg{max-width:96%}}
</style></head><body><div class="wrap"><header class="top"><div><b>NEXORA · المحادثات</b><div class="muted">غرفة دردشة عامة للأعضاء · أوامر الإدارة تبدأ بـ /</div></div><a href="./index.html">رجوع للمتجر</a></header><section class="chat"><div class="head"><h2>💬 دردشة الأعضاء</h2><div class="muted" id="status">جاري الاتصال...</div></div><div id="feed" class="feed"><div class="empty">تحميل الرسائل...</div></div><form id="composer" class="composer"><input id="message" maxlength="1500" placeholder="اكتب رسالتك..." required autocomplete="off"><button type="submit">إرسال</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://xwcukpzibwogtovatxrm.supabase.co","sb_publishable_o2m2T1bxzdxYlgjpgDZQag_K0GoqAsZ",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"sb-xwcukpzibwogtovatxrm-auth-token",storage:window.localStorage}});const $=id=>document.getElementById(id);let me=null,prof={},canDeleteMessages=false;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function draw(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;const el=document.createElement("div");el.className="msg"+(m.sender_id===me.id?" mine":"");el.dataset.id=m.id;const role=m.sender_role||(m.sender_id===me.id?prof.role:"");el.innerHTML=(m.sender_avatar?'<img class="avatar" src="'+esc(m.sender_avatar)+'">':'<div class="avatar"></div>')+'<div class="bubble"><div class="meta"><b>'+esc(m.sender_name)+'</b>'+(role?'<span class="role-tag">'+esc(role)+'</span>':'')+'<small>'+new Date(m.created_at).toLocaleString("ar-LY",{hour:"2-digit",minute:"2-digit"})+'</small></div><div class="body">'+esc(m.content)+'</div>'+(canDeleteMessages?'<button type="button" data-delete-message="'+esc(m.id)+'" style="margin-top:7px;background:#713b48;color:white;border:0;border-radius:8px;padding:5px 9px">حذف الرسالة</button>':'')+'</div>'; $("feed").appendChild(el);const del=el.querySelector("[data-delete-message]");if(del)del.onclick=async()=>{if(!confirm("متأكد تبي تحذف الرسالة؟"))return;const q=await sb.from("messages").delete().eq("id",m.id);if(q.error)alert("تعذر حذف الرسالة: "+q.error.message);else el.remove();};$("feed").scrollTop=$("feed").scrollHeight;}
async function init(){try{const s=await sb.auth.getSession();if(s.error)throw s.error;me=s.data.session?.user||null;if(!me){$("feed").innerHTML='<div class="login"><h3>سجّل دخولك للمشاركة</h3><p>الدردشة للأعضاء المسجلين فقط.</p><button onclick="location.href=\'./index.html\'">افتح تسجيل الدخول</button></div>';$("composer").classList.add("hidden");$("status").textContent="يلزم تسجيل الدخول";return;}const p=await sb.from("profiles").select("username,avatar_url,role,roles").eq("id",me.id).maybeSingle();prof=p.data||{};const rr=await sb.from("custom_roles").select("permissions").in("name",prof.roles?.length?prof.roles:[prof.role]);canDeleteMessages=(rr.data||[]).some(x=>(x.permissions||[]).includes("delete_messages")||(x.permissions||[]).includes("all"))||prof.role==="مالك";const r=await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(150);if(r.error){$("status").textContent=r.error.message;return;}if(!r.data.length)$("feed").innerHTML='<div class="empty">مافيش رسائل. ابدأ أول محادثة 👋</div>';r.data.forEach(draw);$("status").textContent="متصل بالدردشة";sb.channel("nexora-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},x=>draw(x.new)).on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},x=>{const id=x.old?.id;if(id){const el=document.querySelector('[data-id="'+id+'"]');if(el)el.remove();}}).subscribe((state)=>{if(state==="SUBSCRIBED")$("status").textContent="متصل بالدردشة";else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT")$("status").textContent="تعذر الاتصال المباشر؛ حدّث الصفحة.";});}catch(err){$("status").textContent="تعذر تحميل الدردشة: "+(err.message||"خطأ اتصال");$("feed").innerHTML='<div class="empty">صار خطأ أثناء تحميل المحادثات. تأكد من الاتصال ثم حدّث الصفحة.</div>';$("composer").classList.add("hidden");}}
$("composer").onsubmit=async e=>{e.preventDefault();const content=$("message").value.trim();if(!content||!me)return;const b=$("composer").querySelector("button");b.disabled=true;
try{
if(content.startsWith("/")){
 const parts=content.split(/\s+/);const cmd=parts[0].toLowerCase();let result;
 if(cmd==="/owner"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"owner",target_username:parts[1],role_names:null,amount:null});
 else if(cmd==="/role"&&parts[1]&&parts[2])result=await sb.rpc("nexora_chat_command",{cmd:"role",target_username:parts[1],role_names:parts.slice(2).join(" ").split(",").map(x=>x.trim()).filter(Boolean),amount:null});
 else if(cmd==="/clear"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"clear",target_username:null,role_names:null,amount:Number(parts[1])});
 else if(cmd==="/ban"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"ban",target_username:parts[1],role_names:null,amount:null});
 else if(cmd==="/timeout"&&parts[1]&&parts[2])result=await sb.rpc("nexora_chat_command",{cmd:"timeout",target_username:parts[1],role_names:null,amount:Number(parts[2])});
 else if(cmd==="/unban"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"unban",target_username:parts[1],role_names:null,amount:null});
 else { $("status").textContent="الأوامر: /owner اسم | /role اسم رتبة1,رتبة2 | /ban اسم | /timeout اسم دقائق | /unban اسم | /clear عدد"; return; }
 if(result.error)throw result.error;$("status").textContent=result.data||"تم تنفيذ الأمر";$("message").value="";return;
}
const r=await sb.from("messages").insert({sender_id:me.id,sender_name:prof.username||me.email.split("@")[0],sender_avatar:prof.avatar_url||null,sender_role:prof.role||null,content}).select().single();
if(r.error){const msg=r.error.message||"";if(/row-level security|permission denied|violates row-level/i.test(msg))throw new Error("ما عندكش صلاحية إرسال الرسائل أو سياسة قاعدة البيانات تحتاج تحديث. شغّل تحديث SQL الجديد.");if(/محظور|تايم|timeout/i.test(msg))throw new Error(msg);throw new Error("فشل إرسال الرسالة: "+msg);}draw(r.data);$("message").value="";$("status").textContent="تم إرسال الرسالة";
}catch(err){$("status").textContent="تعذر التنفيذ: "+(err.message||"خطأ غير معروف");}
finally{b.disabled=false;}
};
init();
</script></body></html>
