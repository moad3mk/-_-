<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA - المحادثات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f7ff;font-family:system-ui,Arial;min-height:100vh}.wrap{width:min(850px,94%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}.top a{color:white;text-decoration:none;background:#1b2b43;padding:10px 13px;border-radius:10px}.muted{color:#9eabc2;font-size:12px}.chat{height:calc(100dvh - 105px);min-height:430px;background:#111a2b;border:1px solid #263650;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.head{padding:14px;border-bottom:1px solid #263650}.head h2{margin:0}.feed{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;gap:8px;max-width:90%;align-items:flex-start}.msg.mine{align-self:flex-start;flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#263b5c;flex-shrink:0}.bubble{background:#1b2a42;border:1px solid #2a3d5b;border-radius:14px;padding:9px 12px}.mine .bubble{background:#203c52}.meta{display:flex;gap:9px;margin-bottom:4px}.meta b{font-size:12px;font-weight:400;color:#c7d3e8}.meta small{font-size:10px;color:#9eabc2}.role-tag{font-size:10px;color:#aebbd0;font-weight:400;opacity:.8;margin-inline-start:5px}.body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.composer{display:flex;gap:8px;padding:11px;border-top:1px solid #263650}.composer input{flex:1;min-width:0;background:#080f1c;border:1px solid #344764;border-radius:11px;padding:12px;color:white}.composer button,.login button{background:#719cff;border:0;border-radius:11px;padding:0 18px;font-weight:bold}.empty,.login{margin:auto;text-align:center;color:#9eabc2;padding:25px}.login button{padding:12px 18px;margin-top:10px}@media(max-width:520px){.chat{height:calc(100dvh - 95px);border-radius:14px}.msg{max-width:96%}}
</style></head><body><div class="wrap"><header class="top"><div><b>NEXORA · المحادثات</b><div class="muted">غرفة دردشة عامة للأعضاء</div></div><a href="./index.html">رجوع للمتجر</a></header><section class="chat"><div class="head"><h2>💬 دردشة الأعضاء</h2><div class="muted" id="status">جاري الاتصال...</div></div><div id="feed" class="feed"><div class="empty">تحميل الرسائل...</div></div><form id="composer" class="composer"><input id="message" maxlength="1500" placeholder="اكتب رسالتك..." required autocomplete="off"><button type="submit">إرسال</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://xwcukpzibwogtovatxrm.supabase.co","sb_publishable_o2m2T1bxzdxYlgjpgDZQag_K0GoqAsZ");const $=id=>document.getElementById(id);let me=null,prof={};
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function draw(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;const el=document.createElement("div");el.className="msg"+(m.sender_id===me.id?" mine":"");el.dataset.id=m.id;el.innerHTML=(m.sender_avatar?'<img class="avatar" src="'+esc(m.sender_avatar)+'">':'<div class="avatar"></div>')+'<div class="bubble"><div class="meta"><b>'+esc(m.sender_name)+'</b><small>'+new Date(m.created_at).toLocaleString("ar-LY",{hour:"2-digit",minute:"2-digit"})+'</small></div><div class="body">'+esc(m.content)+'</div></div>';$("feed").appendChild(el);$("feed").scrollTop=$("feed").scrollHeight;}
async function init(){const u=await sb.auth.getUser();me=u.data.user;if(!me){$("feed").innerHTML='<div class="login"><h3>سجّل دخولك للمشاركة</h3><p>الدردشة للأعضاء المسجلين فقط.</p><button onclick="location.href=\'./index.html\'">افتح تسجيل الدخول</button></div>';$("composer").classList.add("hidden");$("status").textContent="يلزم تسجيل الدخول";return;}const p=await sb.from("profiles").select("username,avatar_url,role").eq("id",me.id).maybeSingle();prof=p.data||{};const r=await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(150);if(r.error){$("status").textContent=r.error.message;return;}if(!r.data.length)$("feed").innerHTML='<div class="empty">مافيش رسائل. ابدأ أول محادثة 👋</div>';r.data.forEach(draw);$("status").textContent="متصل بالدردشة";sb.channel("nexora-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},x=>draw(x.new)).subscribe();}
$("composer").onsubmit=async e=>{e.preventDefault();const content=$("message").value.trim();if(!content||!me)return;const b=$("composer").querySelector("button");b.disabled=true;const r=await sb.from("messages").insert({sender_id:me.id,sender_name:prof.username||me.email.split("@")[0],sender_avatar:prof.avatar_url||null,content}).select().single();b.disabled=false;if(r.error){$("status").textContent=r.error.message;return;}$("message").value="";};
init();
</script></body></html>
