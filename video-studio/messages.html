<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA - المحادثات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f7ff;font-family:system-ui,Arial;min-height:100vh}.wrap{width:min(850px,94%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}.top a{color:white;text-decoration:none;background:#1b2b43;padding:10px 13px;border-radius:10px}.muted{color:#9eabc2;font-size:12px}.chat{height:calc(100dvh - 105px);min-height:430px;background:#111a2b;border:1px solid #263650;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.head{padding:14px;border-bottom:1px solid #263650}.head h2{margin:0}.feed{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;gap:8px;max-width:90%;align-items:flex-start}.msg.mine{align-self:flex-start;flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#263b5c;flex-shrink:0}.bubble{background:#1b2a42;border:1px solid #2a3d5b;border-radius:14px;padding:9px 12px}.mine .bubble{background:#203c52}.meta{display:flex;gap:9px;margin-bottom:4px}.meta b{font-size:12px;font-weight:400;color:#c7d3e8}.meta small{font-size:10px;color:#9eabc2}.role-tag{font-size:10px;color:#aebbd0;font-weight:400;opacity:.8;margin-inline-start:5px}.body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.composer{display:flex;gap:8px;padding:11px;border-top:1px solid #263650}.composer input{flex:1;min-width:0;background:#080f1c;border:1px solid #344764;border-radius:11px;padding:12px;color:white}.composer button,.login button{background:#719cff;border:0;border-radius:11px;padding:0 18px;font-weight:bold}.empty,.login{margin:auto;text-align:center;color:#9eabc2;padding:25px}.overlay{position:fixed;inset:0;z-index:20;background:#020611df;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}.overlay.show{display:flex}.modal{width:min(440px,100%);background:#111a2b;border:1px solid #263650;border-radius:18px;padding:18px}.close{background:#25334a;color:#fff;border:0;border-radius:9px;padding:8px 12px}.profile-name{background:none;border:0;color:#eef4ff;padding:0;font-weight:bold;font-size:13px}.profile-name:active{color:#54d9e8}.private-row{display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #263650;cursor:pointer}.private-row img{width:40px;height:40px;border-radius:50%;object-fit:cover}.private-row b{display:block}.private-row small{color:#9eabc2}.login button{padding:12px 18px;margin-top:10px}@media(max-width:520px){.chat{height:calc(100dvh - 95px);border-radius:14px}.msg{max-width:96%}}
</style></head><body><div class="wrap"><header class="top"><div><b>NEXORA · المحادثات</b><div class="muted">غرفة دردشة عامة للأعضاء · أوامر الإدارة تبدأ بـ /</div></div><a href="./index.html">رجوع للمتجر</a></header><section class="chat"><div class="head"><h2>💬 دردشة الأعضاء</h2><div class="muted" id="status">جاري الاتصال...</div></div><div id="feed" class="feed"><div class="empty">تحميل الرسائل...</div></div><form id="composer" class="composer"><input id="message" maxlength="1500" placeholder="اكتب رسالتك..." required autocomplete="off"><button type="submit">إرسال</button></form></section></div>
<div class="overlay" id="profileOverlay"><div class="modal"><button class="close" id="closeProfile" style="float:left">✕</button><div id="memberProfile" style="text-align:center;padding-top:15px"></div><button class="primary" id="startPrivate" style="width:100%;margin-top:14px">✉️ مراسلة خاصة</button></div></div>
<div class="overlay" id="privateOverlay"><div class="modal" style="width:min(560px,100%)"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="privateTitle">الرسائل الخاصة</h2><button class="close" id="closePrivate">إغلاق</button></div><div id="privateInbox" class="feed" style="height:55vh;min-height:220px;max-height:55vh;background:#0b1424;border-radius:12px;margin:12px 0"></div><form id="privateComposer" class="composer"><input id="privateText" maxlength="1500" placeholder="اكتب رسالة خاصة..." required><button type="submit">إرسال</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://xwcukpzibwogtovatxrm.supabase.co","sb_publishable_o2m2T1bxzdxYlgjpgDZQag_K0GoqAsZ",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"sb-xwcukpzibwogtovatxrm-auth-token",storage:window.localStorage}});const $=id=>document.getElementById(id);let me=null,prof={},canDeleteMessages=false,memberProfiles={},activePrivateUser=null,privateMode="inbox";
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function draw(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;const el=document.createElement("div");el.className="msg"+(m.sender_id===me.id?" mine":"");el.dataset.id=m.id;const mp=memberProfiles[m.sender_id]||{};const role=mp.mainRole||(m.sender_id===me.id?prof.role:(m.sender_role||""));el.innerHTML=(m.sender_avatar?'<img class="avatar" src="'+esc(m.sender_avatar)+'">':'<div class="avatar"></div>')+'<div class="bubble"><div class="meta"><button class="profile-name" data-profile-user="'+esc(m.sender_id)+'">'+esc(mp.username||m.sender_name)+'</button>'+(role?'<span class="role-tag">'+esc(role)+'</span>':'')+'<small>'+new Date(m.created_at).toLocaleString("ar-LY",{hour:"2-digit",minute:"2-digit"})+'</small></div><div class="body">'+esc(m.content)+'</div>'+(canDeleteMessages?'<button type="button" data-delete-message="'+esc(m.id)+'" style="margin-top:7px;background:#713b48;color:white;border:0;border-radius:8px;padding:5px 9px">حذف الرسالة</button>':'')+'</div>'; $("feed").appendChild(el);el.querySelector("[data-profile-user]")?.addEventListener("click",()=>openMemberProfile(m.sender_id));const del=el.querySelector("[data-delete-message]");if(del)del.onclick=async()=>{if(!confirm("متأكد تبي تحذف الرسالة؟"))return;const q=await sb.from("messages").delete().eq("id",m.id);if(q.error)alert("تعذر حذف الرسالة: "+q.error.message);else el.remove();};$("feed").scrollTop=$("feed").scrollHeight;}
async function init(){try{const s=await sb.auth.getSession();if(s.error)throw s.error;me=s.data.session?.user||null;if(!me){$("feed").innerHTML='<div class="login"><h3>سجّل دخولك للمشاركة</h3><p>الدردشة للأعضاء المسجلين فقط.</p><button onclick="location.href=\'./index.html\'">افتح تسجيل الدخول</button></div>';$("composer").classList.add("hidden");$("status").textContent="يلزم تسجيل الدخول";return;}const p=await sb.from("profiles").select("id,username,avatar_url,role,roles").eq("id",me.id).maybeSingle();prof=p.data||{};const allP=await sb.from("profiles").select("id,username,avatar_url,role,roles");const allR=await sb.from("custom_roles").select("name,permissions,sort_order,icon,color");const roleMap=Object.fromEntries((allR.data||[]).map(x=>[x.name,x]));(allP.data||[]).forEach(x=>{const assigned=[...new Set([...(x.roles||[]),x.role].filter(Boolean))];const ranked=assigned.map(n=>roleMap[n]).filter(Boolean).sort((a,b)=>Number(a.sort_order??9999)-Number(b.sort_order??9999));memberProfiles[x.id]={...x,mainRole:ranked[0]?.name||x.role||"عضو",mainRoleColor:ranked[0]?.color||"#aebbd0",mainRoleIcon:ranked[0]?.icon||""};});const own=memberProfiles[me.id];if(own)prof.role=own.mainRole;const assigned=[...new Set([...(prof.roles||[]),prof.role].filter(Boolean))];const rr=await sb.from("custom_roles").select("name,permissions,sort_order").in("name",assigned);canDeleteMessages=(rr.data||[]).some(x=>(x.permissions||[]).includes("delete_messages")||(x.permissions||[]).includes("all"))||prof.role==="مالك";const r=await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(150);if(r.error){$("status").textContent=r.error.message;return;}if(!r.data.length)$("feed").innerHTML='<div class="empty">مافيش رسائل. ابدأ أول محادثة 👋</div>';r.data.forEach(draw);$("status").textContent="متصل بالدردشة";if(location.hash==="#private")await openPrivateInbox();sb.channel("nexora-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},x=>draw(x.new)).on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},x=>{const id=x.old?.id;if(id){const el=document.querySelector('[data-id="'+id+'"]');if(el)el.remove();}}).subscribe((state)=>{if(state==="SUBSCRIBED")$("status").textContent="متصل بالدردشة";else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT")$("status").textContent="تعذر الاتصال المباشر؛ حدّث الصفحة.";});}catch(err){$("status").textContent="تعذر تحميل الدردشة: "+(err.message||"خطأ اتصال");$("feed").innerHTML='<div class="empty">صار خطأ أثناء تحميل المحادثات. تأكد من الاتصال ثم حدّث الصفحة.</div>';$("composer").classList.add("hidden");}}
async function openMemberProfile(userId){if(!userId)return;let p=memberProfiles[userId];if(!p){const q=await sb.from("profiles").select("id,username,avatar_url,role,roles").eq("id",userId).maybeSingle();p=q.data;if(p){const r=await sb.from("custom_roles").select("name,icon,color,sort_order").in("name",[...(p.roles||[]),p.role].filter(Boolean));const sorted=(r.data||[]).sort((a,b)=>Number(a.sort_order??9999)-Number(b.sort_order??9999));p.mainRole=sorted[0]?.name||p.role||"عضو";p.mainRoleColor=sorted[0]?.color||"#aebbd0";p.mainRoleIcon=sorted[0]?.icon||"";memberProfiles[userId]=p;}}if(!p){alert("تعذر فتح ملف العضو.");return;}activePrivateUser=p;const avatar=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" style="width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #344764">':'<div style="width:92px;height:92px;border-radius:50%;background:#263650;display:grid;place-items:center;margin:auto;font-size:32px">👤</div>';$("memberProfile").innerHTML=avatar+'<h2 style="margin:12px 0 4px">'+esc(p.username||"عضو")+'</h2><p style="color:'+esc(p.mainRoleColor||"#aebbd0")+'">'+esc((p.mainRoleIcon||"")+" "+(p.mainRole||"عضو"))+'</p>'; $("profileOverlay").classList.add("show");}
$("closeProfile").onclick=()=>$("profileOverlay").classList.remove("show");
$("startPrivate").onclick=async()=>{if(!activePrivateUser)return;$("profileOverlay").classList.remove("show");activePrivateUser=activePrivateUser;privateMode="thread";$("privateTitle").textContent="محادثة مع "+(activePrivateUser.username||"عضو");$("privateComposer").classList.remove("hidden");$("privateOverlay").classList.add("show");await loadPrivateThread();};
$("closePrivate").onclick=()=>$("privateOverlay").classList.remove("show");
async function loadPrivateThread(){if(!activePrivateUser||!me)return;const other=activePrivateUser.id;$("privateInbox").innerHTML='<div class="empty">تحميل المحادثة...</div>';const q=await sb.from("private_messages").select("*").or("and(sender_id.eq."+me.id+",recipient_id.eq."+other+"),and(sender_id.eq."+other+",recipient_id.eq."+me.id+")").order("created_at",{ascending:true}).limit(200);if(q.error){$("privateInbox").innerHTML='<div class="empty">تعذر تحميل الخاص: '+esc(q.error.message)+'<br>تأكد من تنفيذ SQL الخاص بالرسائل.</div>';return;}$("privateInbox").innerHTML=(q.data||[]).map(m=>'<div style="max-width:85%;margin:8px '+(m.sender_id===me.id?'auto 8px 0':'8px auto 8px 0')+';background:'+(m.sender_id===me.id?'#203c52':'#1b2a42')+';padding:9px 12px;border-radius:12px"><div>'+esc(m.content)+'</div><small style="color:#9eabc2">'+new Date(m.created_at).toLocaleString("ar-LY",{hour:"2-digit",minute:"2-digit"})+'</small></div>').join("")||'<div class="empty">ابدأ أول رسالة بينك وبين '+esc(activePrivateUser.username||"العضو")+'</div>';$("privateInbox").scrollTop=$("privateInbox").scrollHeight;}
$("privateComposer").onsubmit=async e=>{e.preventDefault();const content=$("privateText").value.trim();if(!content||!activePrivateUser||!me)return;const q=await sb.from("private_messages").insert({sender_id:me.id,recipient_id:activePrivateUser.id,content}).select().single();if(q.error){alert("تعذر إرسال الرسالة الخاصة: "+q.error.message);return;}$("privateText").value="";await loadPrivateThread();};
async function openPrivateInbox(){if(!me){$("status").textContent="سجّل دخولك أولاً للرسائل الخاصة.";return;}activePrivateUser=null;privateMode="inbox";$("privateTitle").textContent="خاصي · المحادثات";$("privateComposer").classList.add("hidden");$("privateInbox").innerHTML='<div class="empty">تحميل المحادثات...</div>';$("privateOverlay").classList.add("show");const q=await sb.from("private_messages").select("*").or("sender_id.eq."+me.id+",recipient_id.eq."+me.id).order("created_at",{ascending:false}).limit(150);if(q.error){$("privateInbox").innerHTML='<div class="empty">تعذر تحميل المحادثات: '+esc(q.error.message)+'</div>';return;}const latest=new Map();(q.data||[]).forEach(m=>{const id=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!latest.has(id))latest.set(id,m);});const ids=[...latest.keys()];if(!ids.length){$("privateInbox").innerHTML='<div class="empty">ما عندكش محادثات خاصة. اضغط على اسم عضو في الشات وابدأ مراسلته.</div>';return;}const ps=await sb.from("profiles").select("id,username,avatar_url,role,roles").in("id",ids);(ps.data||[]).forEach(p=>memberProfiles[p.id]=p);$("privateInbox").innerHTML=ids.map(id=>{const p=memberProfiles[id]||{},m=latest.get(id);return '<div class="private-row" data-open-dm="'+esc(id)+'">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':'<div class="avatar">👤</div>')+'<div><b>'+esc(p.username||"عضو")+'</b><small>'+esc(m.content)+'</small></div></div>';}).join("");document.querySelectorAll("[data-open-dm]").forEach(el=>el.onclick=async()=>{const id=el.dataset.openDm;let p=memberProfiles[id];if(!p){const r=await sb.from("profiles").select("id,username,avatar_url,role,roles").eq("id",id).maybeSingle();p=r.data;}if(!p)return;activePrivateUser=p;$("privateTitle").textContent="محادثة مع "+(p.username||"عضو");$("privateComposer").classList.remove("hidden");await loadPrivateThread();});}
$("privateComposer").classList.remove("hidden");

$("composer").onsubmit=async e=>{e.preventDefault();const content=$("message").value.trim();if(!content||!me)return;const b=$("composer").querySelector("button");b.disabled=true;
try{
if(content.startsWith("/")){
 const parts=content.split(/\s+/);const cmd=parts[0].toLowerCase();let result;
 if(cmd==="/owner"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"owner",target_username:parts[1],role_names:null,amount:null});
 else if(cmd==="/role"&&parts[1]&&parts[2])result=await sb.rpc("nexora_chat_command",{cmd:"role",target_username:parts[1],role_names:parts.slice(2).join(" ").split(",").map(x=>x.trim()).filter(Boolean),amount:null});
 else if(cmd==="/clear"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"clear",target_username:null,role_names:null,amount:Number(parts[1])});
 else if(cmd==="/ban"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"ban",target_username:parts[1],role_names:null,amount:null});
 else if(cmd==="/timeout"&&parts[1]&&parts[2])result=await sb.rpc("nexora_chat_command",{cmd:"timeout",target_username:parts[1],role_names:null,amount:Number(parts[2])});
 else if(cmd==="/unban"&&parts[1])result=await sb.rpc("nexora_chat_command",{cmd:"unban",target_username:parts[1],role_names:null,amount:null});
 else { $("status").textContent="الأوامر: /owner اسم | /role اسم رتبة1,رتبة2 | /ban اسم | /timeout اسم دقائق | /unban اسم | /clear عدد"; return; }
 if(result.error)throw result.error;$("status").textContent=result.data||"تم تنفيذ الأمر";$("message").value="";return;
}
const r=await sb.from("messages").insert({sender_id:me.id,sender_name:prof.username||me.email.split("@")[0],sender_avatar:prof.avatar_url||null,sender_role:prof.role||null,content}).select().single();
if(r.error){const msg=r.error.message||"";if(/row-level security|permission denied|violates row-level/i.test(msg))throw new Error("ما عندكش صلاحية إرسال الرسائل أو سياسة قاعدة البيانات تحتاج تحديث. شغّل تحديث SQL الجديد.");if(/محظور|تايم|timeout/i.test(msg))throw new Error(msg);throw new Error("فشل إرسال الرسالة: "+msg);}draw(r.data);$("message").value="";$("status").textContent="تم إرسال الرسالة";
}catch(err){$("status").textContent="تعذر التنفيذ: "+(err.message||"خطأ غير معروف");}
finally{b.disabled=false;}
};
init();
</script></body></html>
